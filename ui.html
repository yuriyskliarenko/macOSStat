<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { color-scheme:light dark; --bg:#f2f3f7; --side:#e8eaf0; --card:#fff; --fg:#1b1d24; --dim:#6b7080; --line:#eceef3; --track:#e6e8ef; --accent:#0a6cdb; --accent2:#22b8cf; --ok:#22863d; --warn:#a86a00; --bad:#cf2f26; --shadow:0 1px 2px #1b1d240d, 0 6px 18px #1b1d240f; }
@media (prefers-color-scheme:dark) { :root { --bg:#14161c; --side:#191c24; --card:#1f232d; --fg:#eef0f6; --dim:#979db0; --line:#2a2f3b; --track:#303644; --accent:#3d86e8; --accent2:#2cc7d6; --ok:#4cc46c; --warn:#f0b13c; --bad:#ff6b60; --shadow:0 1px 2px #0004, 0 8px 22px #0003; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system, sans-serif; }
button, select { font:inherit; color:inherit; background:var(--card); border:1px solid var(--track); border-radius:8px; padding:5px 11px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
nav { position:fixed; inset:0 auto 0 0; width:208px; padding:14px 10px; background:var(--side); overflow:auto; }
nav p { margin:14px 10px 4px; color:var(--dim); font-size:11px; font-weight:600; }
nav p:first-child { margin-top:0; }
nav button { display:flex; align-items:center; gap:9px; width:100%; margin:0 0 1px; text-align:left; background:none; border-color:transparent; padding:6px 10px; }
nav button:hover { background:color-mix(in srgb, var(--fg) 7%, transparent); }
nav svg { width:16px; height:16px; flex:none; fill:none; stroke:var(--accent); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
nav button[aria-pressed=true] { background:var(--accent); color:#fff; font-weight:600; }
nav button[aria-pressed=true] svg { stroke:#fff; }
#page { margin-left:208px; }
header { position:sticky; top:0; z-index:1; display:flex; gap:10px; align-items:center; padding:14px 22px; background:color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
h1 { font-size:21px; font-weight:700; margin:0; }
#status { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
#status.err { color:var(--bad); }
main { padding:6px 22px 22px; }
#hero { display:grid; grid-template-columns:repeat(auto-fit, minmax(138px, 1fr)); gap:16px; margin:0 0 16px; }
#hero:empty { display:none; }
.tile { background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px 10px 12px; text-align:center; }
.ring { position:relative; width:84px; height:84px; margin:0 auto 8px; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); fill:none; stroke-width:8; stroke-linecap:round; }
.ring .t { stroke:var(--track); }
.ring .f { stroke:var(--accent); }
.ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:18px; font-variant-numeric:tabular-nums; }
.tile span { color:var(--dim); font-size:12px; }
#summary { display:flex; gap:16px; align-items:flex-start; }
.col { flex:1; min-width:0; }
section { background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px 18px 8px; margin:0 0 16px; }
h2 { font-size:15px; font-weight:650; margin:0 0 6px; }
.row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:3px 12px; padding:6px 0; border-top:1px solid var(--line); }
h2 + .row { border-top:0; }
.row > :first-child { color:var(--dim); overflow-wrap:anywhere; }
.v { text-align:right; font-weight:500; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
.bar { grid-column:1/-1; height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--accent2), var(--accent)); }
.note { grid-column:1/-1; color:var(--dim); font-size:11.5px; }
.ok > .v { color:var(--ok); } .warn > .v { color:var(--warn); } .bad > .v { color:var(--bad); }
[hidden] { display:none !important; }
.form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
.form input[type=text] { font:inherit; color:inherit; background:var(--card); border:1px solid var(--track); border-radius:8px; padding:5px 11px; min-width:220px; }
table { width:100%; table-layout:fixed; border-collapse:collapse; font:12px/1.5 ui-monospace, Menlo, monospace; }
th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:anywhere; white-space:pre-wrap; }
th:first-child { width:44%; }
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="page">
<header>
  <h1 id="title"></h1>
  <span id="status"></span>
  <select id="rate" aria-label="Оновлення / Refresh">
    <option value="1000" data-t="1 с">1 с</option><option value="5000" data-t="5 с" selected>5 с</option>
    <option value="10000" data-t="10 с">10 с</option><option value="0" data-t="пауза">пауза</option>
  </select>
  <select id="lang" aria-label="Мова / Language"><option value="en">English</option><option value="uk">Українська</option></select>
</header>
<main><div id="hero"></div><div id="summary"></div>
<div id="snaps" hidden>
  <div class="form"><input id="snapName" type="text" data-tp="Назва знімка" maxlength="64" spellcheck="false"><button id="snapSave" data-t="Зберегти знімок">Зберегти знімок</button></div>
  <div class="form"><select id="snapA" aria-label="Було / Before"></select> → <select id="snapB" aria-label="Стало / After"></select>
    <label><input id="snapAll" type="checkbox"> <span data-t="і лічильники">і лічильники</span></label><button id="snapDiff" data-t="Порівняти">Порівняти</button></div>
  <table id="diff" hidden><thead><tr><th data-t="Параметр">Параметр</th><th data-t="Було">Було</th><th data-t="Стало">Стало</th></tr></thead><tbody></tbody></table>
</div></main>
</div>
<script>
let lang = '{{LANG}}';
const EN = { '1 с': '1 s', '5 с': '5 s', '10 с': '10 s', 'пауза': 'paused', 'Назва знімка': 'Snapshot name',
  'Зберегти знімок': 'Save snapshot', 'і лічильники': 'include counters', 'Порівняти': 'Compare', 'Параметр': 'Parameter',
  'Було': 'Before', 'Стало': 'After', 'Доступно пам’яті': 'Memory available', 'Диск зайнято': 'Disk used', 'Заряд': 'Charge',
  'Кристал SoC': 'SoC die', 'Сигнал Wi-Fi': 'Wi-Fi signal', 'Помилка: ': 'Error: ', 'Головне': 'Main', 'Залізо': 'Hardware',
  'Наживо': 'Live', 'Знімки': 'Snapshots', 'Завантаження…': 'Loading…', 'поточний стан': 'current state',
  'Збережено': 'Saved', 'Змін: ': 'Changes: ' };
const T = s => lang === 'en' && EN[s] || s;
function applyLang() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = T(e.dataset.t);
  for (const e of document.querySelectorAll('[data-tp]')) e.placeholder = T(e.dataset.tp);
}
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const SNAPS = '#snapshots';
let current = 'summary', timer = 0;

// Overview rings: key fragment -> caption
const RINGS = [['kern.memorystatus_level', 'Доступно пам’яті'], ['vm.swapusage', 'Swap'],
  ['SPStorageDataType', 'Диск зайнято'], ['ioreg: CurrentCapacity', 'Заряд'],
  ['HID: PMU tdie', 'Кристал SoC', '°'], ['rssiValue', 'Сигнал Wi-Fi']];
const NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  e.append(...kids);
  return e;
}
function drawHero(sections) {
  if (current !== 'summary') return;
  const items = sections.flatMap(s => s.items || []).filter(it => it.percent !== undefined);
  $('hero').replaceChildren(...RINGS.flatMap(([key, label, unit = '%']) => {
    const it = items.find(i => i.key.includes(key));
    if (!it) return [];
    const len = 2 * Math.PI * 38, tile = el('div', 'tile'), ring = el('div', 'ring');
    const circle = (cls, extra) => svg('circle', { class: cls, cx: 46, cy: 46, r: 38, ...extra });
    const fill = it.percent < 0.5 ? [] : [circle('f', { 'stroke-dasharray': `${len * it.percent / 100} ${len}` })];
    ring.append(svg('svg', { viewBox: '0 0 92 92' }, circle('t'), ...fill), el('b', '', Math.round(it.percent) + unit));
    tile.title = it.value;
    tile.append(ring, el('span', '', T(label)));
    return [tile];
  }));
}

function drawSummary(sections) {
  const sig = JSON.stringify(sections);
  if (sig === drawSummary.sig || !getSelection().isCollapsed) return; // keep the user's selection
  drawSummary.sig = sig;
  drawHero(sections);
  layout(sections.map(s => {
    const box = el('section');
    box.append(el('h2', '', s.title));
    for (const it of s.items || []) {
      const row = el('div', 'row ' + (it.level || ''));
      row.title = it.key;
      row.append(el('span', '', it.label), el('span', 'v', it.value));
      if (it.percent !== undefined) {
        const bar = el('div', 'bar'), fill = el('i');
        fill.style.width = it.percent + '%';
        bar.append(fill);
        row.append(bar);
      }
      if (it.note) row.append(el('div', 'note', it.note));
      box.append(row);
    }
    return box;
  }));
}

function status(text, err) { $('status').textContent = text; $('status').classList.toggle('err', !!err); }

async function call(req) {
  const d = JSON.parse(await webkit.messageHandlers.snapshot.postMessage(JSON.stringify(req)));
  if (d.error) throw new Error(d.error);
  return d;
}

async function tick(auto) {
  clearTimeout(timer);
  if (current === SNAPS) return;
  if (auto && document.hidden) return; // visibilitychange resumes
  const name = current;
  try {
    const d = await call({ op: 'view', name });
    if (d.categories) drawNav(d.categories);
    if (name !== current) return; // the tab has been switched
    drawSummary(d.sections || []);
    status(new Date().toLocaleTimeString(lang === 'en' ? 'en-GB' : 'uk'));
  } catch (e) {
    if (name !== current) return;
    status(T('Помилка: ') + (e.message || e), true);
  }
  schedule();
}
function schedule() {
  clearTimeout(timer);
  const ms = +$('rate').value;
  if (ms) timer = setTimeout(tick, ms, true);
}
const ICONS = {
  summary: 'M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z', diagnosis: 'M1 8h3l2-5 4 10 2-5h3',
  system: 'M2 3h12v8H2zM6 14h4M8 11v3', cpu: 'M4 4h8v8H4zM6 1v3M10 1v3M6 12v3M10 12v3M1 6h3M1 10h3M12 6h3M12 10h3',
  passport: 'M3 1.5h10v13H3zM5.5 11.5h5M8 8.5a2 2 0 100-4 2 2 0 000 4z', memory: 'M1 4h14v7H1zM4 4v4M8 4v4M12 4v4M3 11v2M13 11v2',
  disks: 'M2 9l2-6h8l2 6v4H2zM2 9h12M11 11h1', rates: 'M2 13l4-5 3 3 5-8M10 3h4v4',
  battery: 'M1 5h12v6H1zM15 7v2M3 7h5v2H3z', sensors: 'M6.5 9V3a1.5 1.5 0 013 0v6a3 3 0 11-3 0zM8 6v5',
  wakes: 'M13 10A6 6 0 016 3a6 6 0 107 7z', devices: 'M1 3h9v7H1zM4 13h3M12 6h3v8h-3z',
  network: 'M1 6a10 10 0 0114 0M3.5 9a6.5 6.5 0 019 0M6 11.7a3 3 0 014 0M8 14h0', security: 'M8 1l6 2v5c0 4-3 6-6 7-3-1-6-3-6-7V3z',
  limits: 'M2 12a6 6 0 1112 0M8 12l3-4', '#snapshots': 'M1 4h4l1-2h4l1 2h4v9H1zM8 11a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',
};
const GROUPS = [['Головне', ['summary', 'diagnosis']],
  ['Залізо', ['system', 'cpu', 'passport', 'memory', 'disks', 'devices']],
  ['Наживо', ['rates', 'network', 'battery', 'sensors', 'wakes']],
  ['macOS', ['security', 'limits', SNAPS]]];
// Each card goes to the currently shortest column.
const columnCount = () => Math.max(1, Math.floor(($('summary').clientWidth + 16) / 356));
function layout(cards) {
  const cols = Array.from({ length: columnCount() }, () => el('div', 'col'));
  $('summary').replaceChildren(...cols);
  for (const card of cards) cols.reduce((a, b) => b.offsetHeight < a.offsetHeight ? b : a).append(card);
  layout.cards = cards;
}
addEventListener('resize', () => {
  const cols = $('summary').childElementCount;
  if (cols && cols !== columnCount()) layout(layout.cards);
});

function drawNav(list) {
  if ($('nav').childElementCount) return;
  const titles = { [SNAPS]: T('Знімки') };
  for (const c of list) titles[c.name] = c.title;
  for (const [title, names] of GROUPS) {
    $('nav').append(el('p', '', T(title)));
    for (const name of names.filter(n => titles[n])) {
      const b = el('button');
      b.dataset.tab = name;
      b.append(svg('svg', { viewBox: '0 0 16 16', 'aria-hidden': true }, svg('path', { d: ICONS[name] || '' })), el('span', '', titles[name]));
      b.onclick = () => openTab(name);
      $('nav').append(b);
    }
  }
  markTab();
}
function markTab() {
  for (const b of $('nav').children) {
    const on = b.dataset.tab === current;
    b.setAttribute('aria-pressed', on);
    if (on) $('title').textContent = b.textContent;
  }
}
function openTab(name) {
  current = name;
  markTab();
  getSelection().removeAllRanges();
  drawSummary.sig = null;
  $('summary').replaceChildren();
  $('hero').replaceChildren();
  scrollTo(0, 0);
  const snaps = name === SNAPS;
  $('snaps').hidden = !snaps; $('rate').hidden = snaps;
  if (snaps) { clearTimeout(timer); status(''); loadSnaps(); return; }
  status(T('Завантаження…'));
  tick();
}
async function loadSnaps() {
  try {
    const d = await call({ op: 'snapshots' });
    const opts = d.snapshots.map(s => [s.name, `${s.name} · ${s.at} · ${s.os}`]);
    const fill = (sel, list) => {
      const old = sel.value;
      sel.replaceChildren(...list.map(([v, t]) => new Option(t, v)));
      if (list.some(([v]) => v === old)) sel.value = old;
    };
    fill($('snapA'), opts);
    fill($('snapB'), [[d.now, T('поточний стан')], ...opts]);
    $('snapDiff').disabled = !opts.length;
  } catch (e) { status(T('Помилка: ') + (e.message || e), true); }
}
$('snapSave').onclick = async () => {
  try {
    await call({ op: 'save', name: $('snapName').value.trim() });
    $('snapName').value = '';
    status(T('Збережено'));
    await loadSnaps();
  } catch (e) { status(T('Помилка: ') + (e.message || e), true); }
};
$('snapDiff').onclick = async () => {
  try {
    const d = await call({ op: 'diff', a: $('snapA').value, b: $('snapB').value, all: $('snapAll').checked });
    $('diff').tBodies[0].replaceChildren(...d.changes.map(c => {
      const tr = el('tr');
      tr.append(el('td', '', c.key), el('td', '', c.old), el('td', '', c.new));
      return tr;
    }));
    $('diff').hidden = false;
    status(T('Змін: ') + d.changes.length);
  } catch (e) { status(T('Помилка: ') + (e.message || e), true); }
};
$('lang').onchange = async () => {
  const next = $('lang').value;
  try {
    await call({ op: 'lang', name: next });
    lang = next;
    $('nav').replaceChildren(); // titles arrive with the next response
    applyLang();
    if (current === SNAPS) drawNav((await call({ op: 'categories' })).categories);
    openTab(current);
  } catch (e) { $('lang').value = lang; status(T('Помилка: ') + (e.message || e), true); }
};
applyLang();
$('rate').onchange = schedule;
document.addEventListener('visibilitychange', () => { if (!document.hidden && +$('rate').value) tick(); });
openTab('summary');
</script>
</body>
</html>
