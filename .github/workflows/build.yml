name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no third-party modules
      - run: ./build.sh release
      - name: Verify the build
        run: |
          codesign --verify --strict dist/macOSStat
          archs=$(lipo -archs dist/macOSStat)
          [[ $archs == *arm64* && $archs == *x86_64* ]]
          dist/macOSStat --help
      - uses: actions/upload-artifact@v7
        with:
          name: macOSStat
          path: dist/macOSStat.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macOSStat
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" macOSStat.tar.gz --repo "$GITHUB_REPOSITORY" --title "macOSStat $TAG" --generate-notes
